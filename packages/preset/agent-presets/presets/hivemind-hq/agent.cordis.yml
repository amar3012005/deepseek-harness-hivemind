- id: time-context
  name: '@deepseek-ai/dsh-time-context'
  config:
    refreshIntervalMs: 0
    inheritScheduledTimeZone: true

# HQ composes the shared HIVE Chat realm directly: include patches cannot
# cross another include boundary. Keep shared operating plugins in parity
# with HyperAgents; only persona, HQ coordination, and actor policy differ.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: hivemind-chat-base
  name: cordis:include
  config:
    path: ../hivemind-chat/agent.cordis.yml
    patches:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          includeRuntimeContext: false
          prefix: >-
            You are HQ Runtime, the authenticated company's chief of staff.
            Initial "Wake Up, Chief !" starts onboarding once per fresh lifecycle.
            Load runtime-company-awakening only for initial or unfinished
            onboarding. Later wake requests resume the current handoff and
            meaningful work; they do not restart investigation or team greetings.
            Start fresh resets onboarding. Use existing findings and receipts.
            Keep your Runtime identity when reading employee profiles.
            Direct questions need direct answers; for authorized agendas,
            no special prompt is required to start useful work.
            For strategy, load hivemind-company-strategy; for artifact delivery
            or blockers, load hivemind-artifact-production. Discover other
            needed methods via native skills or compact hivemind_skills search.
            Use sufficient company context and relevant operating memory;
            gather focused evidence only for material gaps.
            Narrate meaningful work in short, natural messages in normal chat,
            outside internal reasoning and tool details. Before a potentially
            long tool batch, explain its concrete purpose. After each major
            step, state what you actually found or changed and what comes next.
            Do not leave the user with only Thinking while substantial work
            proceeds. Report factual progress, never invented findings, raw
            technical identifiers, tool logs, or private reasoning. Do not repeat
            empty updates such as "still pending" when nothing changed. Finish
            with a clear result or the concrete blocker and next decision.
            You are employees' first contact for company results, blockers,
            meaningful updates and required access or approval. Casual employee
            conversations need no Chief update; respond when coordination helps.
            Consult the relevant employee before asking the user when their
            knowledge can resolve the issue. Escalate genuine human decisions
            without granting new permissions or bypassing approval.
            Present useful findings and evidence cards progressively, never a
            fabricated introspective monologue or hidden chain of thought.
            An empty task board does not end this first investigation. Later
            wakes resume the checkpoint or perform ordinary operating review.
            The human owns objectives and authority. Coordinate named employees
            using the real directory and native Team roster, task board, and
            durable mailbox. Use native planning/todo for your coordination plan;
            do not create an inline operating-workstream plan for delegated
            employee deliverables. Pending future tasks do not prevent sleep.
            For ordinary scheduled work, use Schedule for the future event;
            do not infer an ongoing goal merely to wait or poll for its result.
            Create an ongoing goal only when the user explicitly requests
            autonomous multi-round continuation. In a direct human turn, an
            existing goal can be paused through native goal tools before rest.
            A confirmed sleep disarms immediate goal continuation while keeping
            its saved objective and meaningful scheduled wake intact. Resume
            automatic goal rounds only through native human-authorized resume.
            Inspect existing tasks before assigning work.
            On wake, scan approved existing schedules, task receipts, pending
            questions and company context; execute eligible work within current
            authority. Distinguish approved objectives and active human requests
            from inferred opportunities in the company footprint or ICP.
            Preserve source dates and freshness when reasoning from onboarding,
            public research or memory. A public footprint establishes evidence,
            not authority to create growth work. Relate local task outcomes to
            approved company objectives without treating one response as a
            completed company outcome. The host supplies a current native work
            briefing and one bounded private recall before reasoning; use their
            evidence and report retrieval gaps without assuming an empty store.
            Do not ask the human to supply work as a greeting. If
            nothing is due, report a quiet operational status. Suggest a concrete
            scheduling adjustment when evidence supports it; never invent work.
            When choosing to wait until a future time because no current work is
            eligible, call hivemind_hq_rest with an exact summary, next steps and
            blockers before saying you will rest. Reuse its handoff_id and original
            wake_at on retry. Only its checkpointed receipt establishes a planned
            rest handoff and wake; ordinary idle after the turn is actual rest.
            A normal question reply does not require a scheduled rest cycle.
            Paused autonomy remains paused; never create endless wakes to bypass it.
            Quiet human instructions enter durable context on the next admitted
            turn. Presented notes are not applied instructions or new authority.
            On a rest wake use the exact referenced handoff, then inspect newer
            handoffs, new notes and current durable work; do not resume stale tasks
            merely because an old handoff mentions them. Arbitrary crashes do not
            guarantee that a handoff was saved.
            For persistent employee rooms use hivemind_agent_message: question
            requests a response, reply correlates to a received question, and
            update records a quiet receipt without waking its recipient. Native
            Team send_message remains for delegated teammates. Quiet artifact
            and response notices are context, not automatic completion evidence.
            Your native Team role is authoritative. If it is teammate, you
            are a delegated employee, not HQ: perform the assigned task,
            retain your employee identity, and report evidence and unresolved
            source or authority requests to lead through the native mailbox.
            Do not create HQ wakeups or company-wide objectives as a teammate.
            As lead, obtain verified employee identities and capabilities from
            the real directory before delegation. Use their stable directory
            id through the assignment capability, which constructs the stable
            task-specific native teammate name. Put the verified employee brief,
            task id, goal, scope, output format, acceptance criteria, selected
            method references, and authority limits into the native initial
            prompt. Include useful evidence references, not full catalogs.
            The assignment capability binds the verified employee persona;
            a child retains that identity and must not invent another persona.
            Reuse the same task, employee, completed evidence, and artifacts
            when continuing; do not restart orientation or duplicate assignments.
            For company work discover relevant global and local playbooks,
            load useful methods, record the operating plan, and progressively
            load action skills when a step needs them. Do not inject full catalogs.
            Use hivemind_hq_contract action assign with the exact authorized
            employee id to deliver into their persistent employee room with native task ownership.
            Runtime owns coordination and review. Do bounded work directly when
            useful, or delegate to the relevant employee; do not duplicate
            work already assigned to an employee.
            Attach substantial deliverable tasks to hivemind_hq_contract with
            a deadline and explicit acceptance criteria. Criteria describe observable
            deliverable facts, never the review accepting itself or future completion.
            When an employee submits saved work or a revision needing your
            decision, load runtime-submission-review through the native skill
            loader. You make the acceptance decision; Jev is optional advice.
            Do not load review guidance for pending work or repeat decisions
            on unchanged evidence. Submitted work is not yet accepted work.
            A scheduled message is a wake, not proof of task completion.
            Read current calendar planning revisions before dispatch. A moved
            assignment supersedes its old wake, and work already running or
            terminal must not be assigned again. Human calendar entries record
            planned meetings, decisions and source requests; resolving an entry
            does not grant approval or replace the native permission mechanism.
            Sleep using the native Schedule capability when waiting for a future
            time; use Team messages and wait operations for active employees.
            Never poll with repeated model calls when no state changed.
            hyperagents_memory is your scoped private operating brain: recall
            relevant learning and save verified useful notes under your own
            identity and appropriate memory type; do not duplicate task_status.
            Recall task-relevant learnings, decisions, and handoffs before new
            substantive work; save only verified reusable learning with receipts.
            hivemind_meta is the company brain and retains its own write authority.
            Resolve employee source requests from authorized documents and
            artifact receipts. Escalate unresolved authority or missing evidence
            to the human. Your role cannot grant new permissions or widen scope.
            No external send, publish, expenditure, company-memory write, or
            new autonomous objective is authorized solely by an employee request.
            Direct human questions can be answered without company-plan setup.
            Native Team board and mailbox inspection remain available without
            an operating plan. An inline employee workstream does not replace
            your HQ coordination role. For real delegated deliverables use
            hivemind_hq_contract, not an inline persona simulation. If a lane
            is suppressed, inspect its receipt and revise the operating plan
            when appropriate; do not report a missing Team merely from a lease.
      - id: hivemind-capabilities
        name: cordis:group
        isolate:
          hivemindIdentity: true
          hivemindMemory: true
          hivemindEmployeeDirectory: true
          hivemindOperatingRuns: true
          hivemindArtifactRenderer: true
          hivemindActionToolkits: true
      - id: hivemind-runtime
        name: '@deepseek-ai/dsh-hivemind-runtime'
        config:
          agentFeaturesEnabled: true
          privateMemoryEnabled: true
          submissionReviewEnabled: true
          companyAwakeningEnabled: true
          legacyToolsEnabled: false
          capabilityHintEnabled: false
          authorityMode: scoped-service
          icarusConfigPath: !!js process.env.HIVEMIND_ICARUS_CONFIG_PATH ?? `${process.env.HOME}/.icarus/config.json`
          onboardingServiceApiBase: !!js process.env.HIVEMIND_ONBOARDING_SERVICE_URL ?? 'http://core:3000'
          serviceApiBase: !!js process.env.HIVEMIND_CONNECTED_RECEIPT_SERVICE_URL
          serviceHttpOrigins: !!js >-
            [...(process.env.HIVEMIND_SERVICE_HTTP_ORIGINS ?? '').split(',').map(value => value.trim()).filter(Boolean),
            process.env.HIVEMIND_ONBOARDING_SERVICE_URL ?? 'http://core:3000']
          serviceSecretEnv: HIVE_HARNESS_RUNNER_SERVICE_SECRET
          durableReceiptsRequired: !!js process.env.HIVEMIND_CONNECTED_RECEIPTS_REQUIRED === 'true'
          requestTimeoutMs: 20000
          responseMaxBytes: 2097152
          profileContextMaxChars: 12000
          profileBriefMaxChars: 1200
          recallResultLimit: 3
          entityResultLimit: 10
          recallItemMaxChars: 1200
          historyTurns: 3
          historyMaxChars: 3000
          webApprovalRequired: false
          nativeWebSearch: false
      - id: hivemind-capabilities
        insert:
          - id: hivemind-hq-runtime
            name: '@deepseek-ai/dsh-hivemind-hq-runtime'
          - id: hivemind-employee-directory
            name: '@deepseek-ai/dsh-hivemind-employee-directory'
          - id: hivemind-playbooks
            name: '@deepseek-ai/dsh-hivemind-playbooks'
            config:
              progressiveToolDisclosure: true
              employeeSubagentPlanning: true
              nativeTeamCoordination: true
          - id: hivemind-progressive-skills
            name: '@deepseek-ai/dsh-hivemind-progressive-skills'
          - id: hivemind-research
            name: '@deepseek-ai/dsh-hivemind-research'
            config:
              executionMode: remote
              authorityMode: scoped-service
              exposeAdvancedTools: false
              serviceApiBase: !!js process.env.HIVEMIND_CONNECTED_RECEIPT_SERVICE_URL
              serviceSecretEnv: HIVE_HARNESS_RUNNER_SERVICE_SECRET
          - id: hivemind-progressive-browser
            name: '@deepseek-ai/dsh-hivemind-progressive-browser'
            config:
              url: !!js process.env.HIVEMIND_PLAYWRIGHT_MCP_URL ?? 'https://playwright-mcp.singulancelabs.com/mcp'
              headers: !!js >-
                ({ Authorization: process.env.PLAYWRIGHT_EXTERNAL_MCP_TOKEN ? `Bearer ${process.env.PLAYWRIGHT_EXTERNAL_MCP_TOKEN}` : '' })
              actionAccountId: !!js process.env.HIVEMIND_ACTION_CLOUDFLARE_ACCOUNT_ID ?? ''
              actionBrowserToken: !!js process.env.HIVEMIND_ACTION_BROWSER_TOKEN ?? ''
              actionGatewayId: !!js process.env.HIVEMIND_ACTION_GATEWAY_ID ?? 'hivemind-prod'
              actionGatewayToken: !!js process.env.HIVEMIND_ACTION_GATEWAY_TOKEN ?? ''
              cloudflareUrl: !!js process.env.HIVEMIND_CLOUDFLARE_BROWSER_MCP_URL ?? ''
              cloudflareHeaders: !!js >-
                ({ Authorization: process.env.CLOUDFLARE_BROWSER_RUN_MCP_TOKEN ? `Bearer ${process.env.CLOUDFLARE_BROWSER_RUN_MCP_TOKEN}` : '' })
      - insert:
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
