# HIVE-only final layer over dsh-base + dsh-web-app. HIVE model and tenant
# capabilities live here so the shipped Web, Standard, Minimal, PTC, and
# Creator compositions remain unchanged.
- id: llm-pi-ai
  config:
    providers:
      cloudflare-openrouter:
        displayName: Cloudflare AI Gateway / OpenRouter
        apiKeyEnv: CLOUDFLARE_API_KEY
        api: openai-completions
        baseURL: https://gateway.ai.cloudflare.com/v1/0dc6b9186b5a9b8985613b10c1c59f4f/hivemind-prod/compat
        headers:
          cf-aig-byok-alias: first-bundb
        defaultContextWindow: 131072
        defaultMaxTokens: 32768
        defaultInput: [text]
        retryPolicy:
          mode: normal
          maxRetries: 3
        models:
          - id: openrouter/openai/gpt-oss-120b
            name: GPT OSS 120B via Cloudflare
            contextWindow: 131072
            maxTokens: 32768
            input: [text]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high

- id: agent-default-model
  config:
    provider: cloudflare-openrouter
    model: openrouter/openai/gpt-oss-120b

- id: session-persistence-jsonl
  disabled: true

# Keep the internal workspace registry required by native session lifecycle.
# Its filesystem, controller, and UI consumers remain unavailable below.
- id: workspace-files
  disabled: true
- id: workspace-controller
  disabled: true
- id: file-reference-local
  disabled: true
- id: directory-picker
  disabled: true
- id: plugin-inventory
  disabled: true
- id: settings-controller
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-sidebar
  disabled: true
- id: ui-sidebar-right
  disabled: true
- id: ui-sidebar-textpreview
  disabled: true
- id: ui-sidebar-files
  disabled: true
- id: ui-settings
  disabled: true
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-workspace
  disabled: true

- id: webserver
  config:
    host: 0.0.0.0
    port: !!js Number(process.env.PORT ?? 3080)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: agent-presets
  config:
    default: hivemind-chat
    includeShippedRoot: true
    includeUserRoot: false
    allowed: [hivemind-chat]

- insert:
    - id: hivemind-execution-scope
      name: '@deepseek-ai/dsh-hivemind-execution-scope'

    - id: session-persistence-postgres
      name: '@deepseek-ai/dsh-session-persistence-postgres'
      config:
        connectionStringEnv: DATABASE_URL
        schema: hivemind
        leaseTtlMs: 30000
        maxConnections: 10

    - id: hivemind-web-runner
      name: '@deepseek-ai/dsh-hivemind-web-runner'
      config:
        parentOrigins: !!js (process.env.HIVEMIND_PARENT_ORIGINS ?? '').split(',').map(value => value.trim()).filter(Boolean)
        ticketSecretEnv: HIVE_HARNESS_TICKET_SECRET
        redisUrlEnv: REDIS_URL
        redisJtiPrefix: 'hive:harness-ticket:'
        sessionMaxAgeSeconds: 900
