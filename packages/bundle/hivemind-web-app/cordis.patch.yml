# HIVE-only final layer over dsh-base + dsh-web-app. HIVE model and tenant
# capabilities live here so the shipped Web, Standard, Minimal, PTC, and
# Creator compositions remain unchanged.
- id: llm-pi-ai
  config:
    providers:
      cloudflare-openrouter:
        displayName: Cloudflare AI Gateway / OpenRouter
        apiKeyEnv: CLOUDFLARE_API_KEY
        api: openai-completions
        baseURL: https://gateway.ai.cloudflare.com/v1/0dc6b9186b5a9b8985613b10c1c59f4f/hivemind-prod/compat
        headers:
          cf-aig-byok-alias: first-bundb
        defaultContextWindow: 131072
        defaultMaxTokens: 32768
        defaultInput: [text]
        retryPolicy:
          mode: normal
          maxRetries: 3
        models:
          - id: openrouter/openai/gpt-oss-120b
            name: GPT OSS 120B via Cloudflare
            contextWindow: 131072
            maxTokens: 32768
            input: [text]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
          # Economical OpenRouter catalogue entries. The gateway keeps the
          # provider route stable while the picker exposes these alternatives.
          - id: openrouter/nvidia/nemotron-3-nano-omni:free
            name: NVIDIA Nemotron 3 Nano Omni (free)
            contextWindow: 300000
            maxTokens: 16384
            # The installed Harness model schema presently exposes text/image
            # input only. Keep Omni selectable for text/image workflows.
            input: [text, image]
          - id: openrouter/google/gemma-4-26b-a4b:free
            name: Google Gemma 4 26B A4B (free)
            contextWindow: 262144
            maxTokens: 16384
            input: [text, image]
          - id: openrouter/google/gemma-4-31b:free
            name: Google Gemma 4 31B (free)
            contextWindow: 262144
            maxTokens: 16384
            input: [text, image]
          - id: openrouter/nvidia/nemotron-3-super:free
            name: NVIDIA Nemotron 3 Super (free)
            contextWindow: 1048576
            maxTokens: 32768
            input: [text]
          - id: openrouter/mistralai/mistral-nemo
            name: Mistral Nemo
            contextWindow: 131072
            maxTokens: 16384
            input: [text]
          - id: openrouter/meta-llama/llama-3.1-8b-instruct
            name: Meta Llama 3.1 8B Instruct
            contextWindow: 131072
            maxTokens: 16384
            input: [text]
          - id: openrouter/openai/gpt-oss-20b
            name: OpenAI GPT OSS 20B
            contextWindow: 131072
            maxTokens: 16384
            input: [text]
          - id: openrouter/inception/mercury-2.5
            name: Inception Mercury 2.5
            contextWindow: 131072
            maxTokens: 16384
            input: [text]
          - id: openrouter/google/gemma-3-4b-it
            name: Google Gemma 3 4B IT
            contextWindow: 131072
            maxTokens: 8192
            input: [text, image]
          - id: openrouter/deepseek/deepseek-v4-flash-0731
            name: DeepSeek V4 Flash 0731
            contextWindow: 1310720
            maxTokens: 32768
            input: [text]

- id: agent-default-model
  config:
    provider: cloudflare-openrouter
    model: openrouter/deepseek/deepseek-v4-flash-0731

- id: session-persistence-jsonl
  disabled: true

- id: workspace
  disabled: true
- id: workspace-files
  disabled: true
- id: file-reference-local
  disabled: true
- id: directory-picker
  disabled: true
- id: plugin-inventory
  disabled: true
- id: open-in-app
  disabled: true

# Keep the complete native deliverables package in the image and browser bundle,
# but do not activate its privileged host half when HIVE filesystem services are
# policy-disabled. Native mode still activates the stock plugin unchanged.
- id: ui-deliverables
  disabled: true

# Da-vinci owns browser navigation; keep the native Harness conversation,
# tool, trajectory, and replay surfaces without a second shell/sidebar track.
- id: ui-layout
  config:
    externalChrome: true
    embeddedSessionRail: true

- id: webserver
  config:
    host: 0.0.0.0
    port: !!js Number(process.env.PORT ?? 3080)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# Preview requests arrive through the existing private edge authority. Keep
# the established admission trust list while replacing only browser UI.
- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts.concat((process.env.HIVEMIND_HARNESS_TRUSTED_HOSTS ?? '').split(',').map(value => value.trim()).filter(Boolean))

- id: agent-presets
  config:
    default: hivemind-chat
    includeShippedRoot: true
    includeUserRoot: false
    allowed: [hivemind-chat]

- insert:
    - id: hivemind-execution-scope
      name: '@deepseek-ai/dsh-hivemind-execution-scope'

    - id: hivemind-virtual-workspace
      name: '@deepseek-ai/dsh-hivemind-virtual-workspace'

    - id: session-persistence-postgres
      name: '@deepseek-ai/dsh-session-persistence-postgres'
      config:
        connectionStringEnv: DATABASE_URL
        schema: hivemind
        leaseTtlMs: 30000
        maxConnections: 10

    - id: hivemind-web-runner
      name: '@deepseek-ai/dsh-hivemind-web-runner'
      config:
        parentOrigins: !!js (process.env.HIVEMIND_PARENT_ORIGINS ?? '').split(',').map(value => value.trim()).filter(Boolean)
        ticketSecretEnv: HIVE_HARNESS_TICKET_SECRET
        redisUrlEnv: REDIS_URL
        redisJtiPrefix: 'hive:harness-ticket:'
        # The native Harness application replaces the Da-vinci route after
        # admission, so there is no shell component left to refresh a
        # short-lived runner cookie. Keep the signed runner grant bounded by
        # the plugin's one-day maximum; Core/Control Plane still exclusively
        # mint the one-time admission ticket and tenant principal.
        sessionMaxAgeSeconds: 86400
        databaseUrlEnv: DATABASE_URL
